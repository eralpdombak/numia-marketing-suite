# Intelligence categories
categories:
  product:
    - feature_launches
    - pricing_changes
    - api_updates
    - performance_improvements

  marketing:
    - blog_posts
    - case_studies
    - webinars
    - partnerships

  business:
    - funding_rounds
    - hiring
    - acquisitions
    - customer_wins

  technical:
    - github_releases
    - documentation_updates
    - breaking_changes
    - bug_reports

# Alert priorities
alert_rules:
  high:
    - pricing_increase
    - new_major_feature
    - funding_announcement
    - customer_complaint

  medium:
    - blog_post
    - partnership
    - conference_speaking
    - github_release

  low:
    - social_post
    - documentation_update
    - minor_update

# Numia positioning (for competitive analysis)
numia:
  strengths:
    - "Cross-chain data consistency (100+ chains)"
    - "IBC-native analytics"
    - "Real-time sync across Cosmos"
    - "Developer-friendly APIs"
  differentiators:
    - "Only platform built for Cosmos/IBC from ground up"
    - "Sub-second data consistency"
    - "No data lag across chains"
  target_customers:
    - "Cosmos ecosystem developers"
    - "Multi-chain dApp builders"
    - "Protocol teams (Osmosis, Celestia, etc.)"
    - "VCs investing in Cosmos"
